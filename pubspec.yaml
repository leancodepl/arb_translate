name: arb_translate
description: >-
  A command-line tool for automatically generating missing translations to ARB
  files using Google Gemini or OpenAI ChatGPT by LeanCode.
version: 2.0.0
repository: https://github.com/leancodepl/arb_translate
issue_tracker: https://github.com/leancodepl/arb_translate/issues
topics:
  - localization
  - l10n
  - arb
  - ai
  - gemini

executables:
  arb_translate:

environment:
  sdk: ^3.2.0

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  dart_openai: ^6.1.1
  file: ^7.0.1
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  intl: ^0.20.2
  meta: ^1.18.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
